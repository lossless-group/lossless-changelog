<svg color="#e2f2f4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!--
    BannerFlag - Static SVG version for favicon
    Three wavy banner lines with tilted flagpole
  -->

  <!-- Top wave line (thick) -->
  <path
    d="M 14 18
       Q 22 14, 32 18
       Q 42 22, 50 18"
    stroke="currentColor"
    stroke-width="4"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Middle wave line (thin) -->
  <path
    d="M 14 28
       Q 22 24, 32 28
       Q 42 32, 50 28"
    stroke="currentColor"
    stroke-width="1.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Bottom wave line (thick) -->
  <path
    d="M 14 38
       Q 22 34, 32 38
       Q 42 42, 50 38"
    stroke="currentColor"
    stroke-width="4"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Flagpole (slightly tilted, extends below) -->
  <path
    d="M 11 14 L 15 56"
    stroke="currentColor"
    stroke-width="4"
    stroke-linecap="round"
    fill="none"
  />
</svg>
