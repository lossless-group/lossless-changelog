<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Lossless Toolkit</title>
  <defs><linearGradient id="ec" gradientUnits="userSpaceOnUse" x1="6" y1="14" x2="58" y2="50"><stop offset="0.0536" stop-color="#22a6b5"/><stop offset="0.2314" stop-color="#9138e0"/><stop offset="0.4756" stop-color="#d9233b"/><stop offset="0.7233" stop-color="#f59c49"/></linearGradient><linearGradient id="ew" gradientUnits="userSpaceOnUse" x1="-4" y1="0" x2="66" y2="0"><stop offset="0.0536" stop-color="#22a6b5"/><stop offset="0.2314" stop-color="#9138e0"/><stop offset="0.4756" stop-color="#d9233b"/><stop offset="0.7233" stop-color="#f59c49"/></linearGradient></defs>
  <rect width="64" height="64" rx="12" fill="#1a151e"/>
  <g transform="translate(4.8 4.8) scale(0.85)">
  <!-- spirit level, lying down: the vial window with its cyan bubble -->
  <rect x="5" y="50" width="54" height="9" rx="2.5" fill="url(#ec)"/>
  <rect x="25" y="52.4" width="14" height="4.2" rx="2.1" fill="#1a151e"/>
  <circle cx="33.2" cy="54.5" r="1.5" fill="#04e5e5"/>
  <!-- claw hammer, upright -->
  <rect x="19" y="13" width="6" height="34" rx="3" fill="url(#ec)"/>
  <path fill="url(#ec)" d="M7 7.5 Q7 5.5 9 5.5 H16 V7.5 H26 Q31.5 7.5 34 12.5 Q29.5 11 26 13.5 H16 V16.5 H9 Q7 16.5 7 14.5 Z"/>
  <!-- open-end wrench at 45deg; its ring sits on the level's left end -->
  <g transform="translate(10 54.5) rotate(-45)" fill="url(#ew)" stroke="#1a151e" stroke-width="3" paint-order="stroke" stroke-linejoin="round">
    <rect x="-3.5" y="-3.5" width="51.00" height="7" rx="3.5"/>
    <path d="M65.25 -4 A11 11 0 1 0 65.25 4 H60.00 A4 4 0 0 1 60.00 -4 Z"/>
