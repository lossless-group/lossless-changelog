<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark Matter

       A stand-in, not a brand. This project has no favicon in its own repo, so
       the ledger draws one here rather than showing a hole or borrowing a mark
       that means something else. Replace it by committing a favicon.svg
       upstream — sync-icons prefers the real thing automatically.

       Dark-native by construction: this site has one mode. The ground is a
       shade above the page so the chip reads at 15px, and the hairline is 8%
       white, which is the most a border can be here before it becomes the
       thing you notice. -->
  <rect width="64" height="64" rx="14" fill="#161b22"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#9138e0" stroke-width="5"/>
  <circle cx="32" cy="32" r="6.5" fill="#161b22"/>
</svg>
