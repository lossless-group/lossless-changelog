# ── favicon audit, 2026-09-24 ───────────────────────────────────────────────
# Every stream without a mark was opened and searched — not guessed at, and not
# drawn here. What the search actually found, so nobody re-runs it:
#
# FOUND, now declared above:
#   augment-it        splash/public/appIcon__Augment-It.svg
#   corpora-builder   app/static/favicon.svg
#
# FOUND BUT UNUSABLE — the mark exists and is genuinely theirs, but `.mark` in
# ProjectRow.astro is a hard 15x15 square with no object-fit, so a wordmark
# renders as a smear rather than a logo:
#   reach-edu-hub     public/reach-logo.svg                       165x52  (3.2:1)
#   content           visuals/Trademarks/trademark__Lossless.svg  860x185 (4.6:1)
# Neither is worth showing until something here can letterbox them, and at 15px
# even a letterboxed wordmark is 15x5 and unreadable. Left blank on purpose.
#
# PRESENT BUT SOMEONE ELSE'S BRAND — do not take these. Putting a client's mark
# on our row is the same failure nameMatchesStream() exists to prevent:
#   lossless-toolkit-site  public/visuals/appIcon__{Laerdal,Avalanche,Reach,…}
#   memopop-orchestrator   io/*/assets/* and templates/trademarks/* are per-client
#   self-host-stack        every SVG is a vendored upstream logo (postiz, karakeep…)
#
# NO SVG ANYWHERE IN THE REPO — nothing to find, not an oversight:
#   dominocielo-site, stenographer, and all ten content-farm plugin modules
#   (perplexed, cite-wide, image-gin, lmstud-yo, plunk-it, filestarter,
#   file-transporter, grab-reference, image-wrangler, metafetch). The plugins are
#   Obsidian plugins: no public/ dir, no brand assets, by their nature.
#
# The rule this audit confirms: a mark comes out of the project's own repo or it
# does not appear. src/marks/ is for deliberate hand-drawn stand-ins, not for
# filling gaps a script found.

# ── deliberately NOT aggregated ─────────────────────────────────────────────
# These repos carry changelog/ directories and are excluded on purpose. Recorded
# here so a later coverage audit does not "discover" them again and re-add them.
#
#   lossless-monorepo    PRIVATE. The anchor pseudomonorepo.
#   calmstorm-decks      PRIVATE. Gated fundraise deck workspace.
#   lossless-at          PRIVATE.
#   eventcut-ai          PRIVATE.
#   chroma-decks         PRIVATE. Client deck site.
#
# Private repos stay out for the same reason changelog-neo was dropped from the
# sync state on 2026-09-09: this site is public, and a token that can read a
# private repo must never be the reason its contents become public.
#
# Also excluded, and NOT because of visibility:
#   matter-site/changelog/                already aggregated as `dark-matter`,
#                                         which points at the submodule itself.
#   lossless-content/changelog--code/     sibling buckets of the declared
#   lossless-content/changelog--laerdal/  `changelog--content/` stream; the
#                                         `changelog--` deny rule in
#                                         sync-streams.mjs covers them.
#   context-vigilance-kit/corpus/…/       a CORPUS COPY of the agent-skills
#     agent-skills/changelog/             changelog, already aggregated as
#                                         `context`. Ingesting it would double
#                                         every entry — the exact failure the
#                                         provenance guard exists to prevent.
