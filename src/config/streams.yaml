# Changelog streams aggregated by this site.
#
# Every stream is declared EXPLICITLY. Nothing is discovered automatically —
# that is what keeps rolled-up content out (see the spec in
# context-v/specs/Aggregate-Changelog-Streams-Across-the-Lossless-Tree-via-the-GitHub-API.md).
#
# Fields:
#   slug    stable URL segment + dedupe key. Never reuse, never rename casually.
#   repo    owner/name on GitHub.
#   ref     REQUIRED. Never inferred from default_branch — for several repos the
#           default branch has no changelog/ at all.
#   path    directory holding the entries. "" means repo root.
#   parent  slug of the parent stream, or null for a tree root.
#           altitude is DERIVED from depth: 1=fleet, 2=product, 3=component.
#   shape   root-dir | nested-path | submodule-ref | standalone-repo
#           Asserted at sync time: a mismatch is a loud error, not an empty stream.
#   kind    optional. `content` or `context` marks a repo whose non-changelog
#           lines are PROSE, not code. lossless-content is a corpus, not a
#           program; lossless-agent-skills is 184 markdown files that ARE the
#           product. Counting either as code misreports what the work was.
#           Read only by scripts/sync-line-classes.mjs. Default is code.
#   title   display name.
#   splash  optional. The project's own splash page (GitHub Pages) — a page
#           ABOUT the work, generated from changelog/ and context-v/.
#   website optional. The live product on its real domain. A different thing
#           from a splash, and several projects have both.
#
# `n` comments are a 2026-08-08 snapshot proving the stream resolves. They are
# not authoritative and are not rendered anywhere.

streams:
  # ── fleet ──────────────────────────────────────────────────────────────────
  - slug: astro-knots
    repo: lossless-group/astro-knots
    ref: master
    path: changelog/
    parent: null
    shape: root-dir
    splash: https://lossless-group.github.io/astro-knots/
    title: Astro Knots                          # n=12

  - slug: ai-labs
    repo: lossless-group/lossless-ai-labs
    ref: main
    path: changelog/
    parent: null
    shape: root-dir
    splash: https://lossless-group.github.io/lossless-ai-labs/
    title: AI Labs                              # n=12

  - slug: content-farm
    repo: lossless-group/content-farm
    ref: main
    path: changelog/
    parent: null
    shape: root-dir
    splash: https://lossless-group.github.io/content-farm/
    title: Content Farm                         # n=7

  # ── standalone roots (no parent in the tree) ───────────────────────────────
  - slug: content
    repo: lossless-group/lossless-content
    ref: development
    path: changelog--content/
    parent: null
    shape: root-dir
    kind: content
    title: Lossless Content                     # n=26
    # DECLARED FOR ITS LINES, NOT ITS ENTRIES. This repo is a 645k-line prose
    # corpus; counting it as code would swamp every real codebase in the tree,
    # and leaving it out entirely understated the writing by a fifth. Line
    # stats are keyed by REPO and read from the local clone, so the split lands
    # whether or not any entry syncs.
    #
    # No entry will sync: all three of its ledgers are named `changelog--*`
    # (--code, --content, --laerdal) and sync-streams denies that prefix
    # outright as exclusion layer 2. That rule predates this stream and is left
    # alone — `path` names the ledger a reader should go read, and the row
    # honestly shows a corpus with lines but no aggregated ledger.
    #
    # `development` is the live tier here; main and master both stop at
    # 2026-07-14.

  - slug: context
    repo: lossless-group/lossless-agent-skills
    ref: main
    path: changelog/
    parent: null
    shape: root-dir
    kind: context
    splash: https://lossless-group.github.io/lossless-agent-skills/
    title: Lossless Agent Skills                # n=11
    # 184 markdown files, 32 of them SKILL.md. The repo has no code in it — the
    # words are the product — so `kind: context` files its lines under context
    # rather than letting a skill definition count as a program.

  - slug: self-host-stack
    repo: lossless-group/vc-self-host-stack
    ref: main
    path: changelog/
    parent: null
    shape: root-dir
    title: Self-Host Stack                      # n=13

  - slug: lfm
    repo: lossless-group/lossless-flavored-markdown-package
    ref: main
    path: changelog/
    parent: null
    shape: root-dir
    splash: https://lossless-group.github.io/lossless-flavored-markdown-package/
    title: Lossless Flavored Markdown           # n=6

  - slug: neo
    repo: lossless-group/changelog-neo
    ref: main
    path: ""
    parent: null
    shape: standalone-repo
    title: Neo                                  # n=1

  - slug: parslee
    repo: lossless-group/changelog-parslee
    ref: main
    path: ""
    parent: null
    shape: standalone-repo
    title: Parslee                              # n=0 — declared, empty upstream
    enabled: false

  # ── astro-knots sites ──────────────────────────────────────────────────────
  # The first one. It lives at lossless-monorepo/site rather than under
  # astro-knots/sites/ because it predates the conventions — most of what
  # astro-knots codifies was learned here and corrected for afterwards, and the
  # site is too complex to have been refactored back into the fold. Parented
  # here anyway: the hierarchy should say what a thing IS, not where its
  # checkout happens to sit.
  #
  # Two omissions, both already enforced rather than declared here:
  #   changelog/            counted in its own bucket, never as code
  #                         (scripts/sync-line-classes.mjs)
  #   src/generated-content/ a submodule of lossless-content, so it adds no
  #                         lines to this repo's history, and sync-streams.mjs
  #                         denies the path outright as exclusion layer 2.
  - slug: lossless-site
